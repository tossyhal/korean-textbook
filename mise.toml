[tools]
node = "24"
pnpm = "12.11.2"

[tasks.dev]
run = "pnpm run dev"
[tasks.build]
run = "pnpm run build"
[tasks.typecheck]
run = "pnpm run typecheck"
[tasks.lint]
run = "pnpm run lint"
[tasks."format:check"]
run = "pnpm run format:check"
[tasks.test]
run = "pnpm run test"
[tasks."content:check"]
run = "pnpm run content:check"
[tasks."test:browser"]
run = "pnpm run test:browser"
